[[dns]]
type = "A"
name = "pmbuilder"
content = "YOUR_SERVER_IPV4_ADDRESS"
ttl = 120
proxied = true

[ssl]
mode = "strict"
min_tls_version = "1.2"

[security]
level = "medium"
challenge_ttl = 1800

[[waf.rules]]
name = "Rate Limiting - API"
description = "Limit API requests per IP"
expression = "(http.request.uri.path starts with \"/api/\")"
action = "block"
ratelimit = { requests_per_period = 100, period_seconds = 60, mitigation_timeout = 300 }

[[waf.rules]]
name = "SQL Injection Protection"
description = "Block SQL injection patterns"
expression = "(http.request.uri.query contains \"'\" or http.request.uri.query contains \"--\" or http.request.uri.query contains \";\" or http.request.uri.query matches \"\\\\b(UNION|SELECT|INSERT|DROP|DELETE|ALTER)\\\\b\")"
action = "block"

[[waf.rules]]
name = "Block Malicious Bots"
description = "Block known bad user agents"
expression = "(http.user_agent contains \"curl\" and not http.user_agent contains \"healthcheck\") or (http.user_agent contains \"wget\") or (http.user_agent contains \"python-requests\")"
action = "block"

[[waf.rules]]
name = "Country Blocklist"
description = "Block traffic from restricted regions"
expression = "(ip.geoip.country in {\"XX\"})"
action = "block"

[caching]
default_ttl = 3600

[[caching.rules]]
name = "Static Assets Cache"
description = "Cache static assets for 1 year"
expression = "(http.request.uri.path matches \"\\\\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$\")"
ttl = 31536000

[[caching.rules]]
name = "API No Cache"
description = "Never cache API responses"
expression = "(http.request.uri.path starts with \"/api/\")"
ttl = 0

[[page_rules]]
target = "pmbuilder.local/*"
actions = [
    { id = "ssl", value = "strict" },
    { id = "always_online", value = "on" },
    { id = "automatic_https_rewrites", value = "on" },
]
