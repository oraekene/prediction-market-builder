[databases]
pmbuilder = host=postgres port=5432 dbname=pmbuilder

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 40
max_user_connections = 40
server_idle_timeout = 300
client_idle_timeout = 600
query_timeout = 30
pkt_buf = 4096
listen_backlog = 128
tcp_defer_accept = 1
tcp_socket_buffer = 0
tcp_keepalive = 1
